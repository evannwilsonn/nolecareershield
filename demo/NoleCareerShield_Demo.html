<title>NoleCareerShield Demo</title>
<style>
:root{
--canvas:#f5f4ed;--surface:#faf9f5;--sunk:#efede4;--sand:#e8e6dc;--line:#e3e0d5;--line-2:#d9d5c8;--whisper:rgba(20,20,19,.10);
--ink:#141413;--ink-2:#3d3d3a;--muted:#5c5a54;--faint:#77756d;
--accent:#782F40;--accent-hover:#5E2432;--accent-ink:#782F40;--accent-tint:#f3e8e8;--on-accent:#faf9f5;
--gold:#CEB888;--gold-tint:#f4eedd;--gold-ink:#6e5a2c;
--ok:#2f6b4c;--ok-tint:#e5efe7;--warn:#8c560f;--warn-tint:#f5ead6;--bad:#9e3527;--bad-tint:#f5e2dd;--info:#2d4a6b;--info-tint:#e6ecf2;
--shadow:0 4px 18px rgba(20,20,19,.04),0 2px 8px rgba(20,20,19,.027),0 .8px 3px rgba(20,20,19,.02);
--shadow-deep:0 1px 3px rgba(20,20,19,.02),0 7px 15px rgba(20,20,19,.03),0 23px 52px rgba(20,20,19,.06);
--serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--canvas:#161614;--surface:#1e1e1c;--sunk:#141412;--sand:#2a2926;--line:#302f2b;--line-2:#3b3a35;--whisper:rgba(240,238,230,.10);
--ink:#efede5;--ink-2:#d6d3c9;--muted:#aeaa9f;--faint:#8e8b81;
--accent:#9a4458;--accent-hover:#b04f66;--accent-ink:#e3a3b2;--accent-tint:#35222a;--on-accent:#fbf7f3;
--gold:#CEB888;--gold-tint:#302a1c;--gold-ink:#dcc796;
--ok:#8fcaa6;--ok-tint:#1d2c23;--warn:#e6b46c;--warn-tint:#33281a;--bad:#f0a193;--bad-tint:#38211d;--info:#a9c2de;--info-tint:#1e2833;
--shadow:0 1px 2px rgba(0,0,0,.3);--shadow-deep:0 12px 40px rgba(0,0,0,.45);color-scheme:dark;}}
:root[data-theme="dark"]{
--canvas:#161614;--surface:#1e1e1c;--sunk:#141412;--sand:#2a2926;--line:#302f2b;--line-2:#3b3a35;--whisper:rgba(240,238,230,.10);
--ink:#efede5;--ink-2:#d6d3c9;--muted:#aeaa9f;--faint:#8e8b81;
--accent:#9a4458;--accent-hover:#b04f66;--accent-ink:#e3a3b2;--accent-tint:#35222a;--on-accent:#fbf7f3;
--gold:#CEB888;--gold-tint:#302a1c;--gold-ink:#dcc796;
--ok:#8fcaa6;--ok-tint:#1d2c23;--warn:#e6b46c;--warn-tint:#33281a;--bad:#f0a193;--bad-tint:#38211d;--info:#a9c2de;--info-tint:#1e2833;
--shadow:0 1px 2px rgba(0,0,0,.3);--shadow-deep:0 12px 40px rgba(0,0,0,.45);color-scheme:dark;}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);font-size:15px;background:var(--canvas);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;border-radius:4px}
.ic{flex:none;display:block}
.wrap{max-width:920px;margin:0 auto;padding:0 20px}
/* ---------- header ---------- */
header{background:color-mix(in srgb,var(--canvas) 88%,transparent);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--whisper);position:sticky;top:0;z-index:20}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px;max-width:1180px;margin:0 auto}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none}
.brand-name{font-family:var(--serif);font-weight:500;font-size:19px;color:var(--ink);letter-spacing:-.01em}
.brand-name b{font-weight:500;color:var(--accent-ink)}
.nav-actions{display:flex;gap:2px 4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.nav a.ghost,.nav .ghostbtn{text-decoration:none;color:var(--muted);font-size:14px;font-weight:500;padding:8px 11px;border-radius:7px;background:none;border:none;font-family:inherit;cursor:pointer}
.nav a.ghost:hover,.nav .ghostbtn:hover{color:var(--ink);background:var(--whisper)}
.nav a.btn{background:var(--accent);color:var(--on-accent);text-decoration:none;padding:8px 15px;border-radius:8px;font-size:14px;font-weight:600;margin-left:4px}
.nav a.btn:hover{background:var(--accent-hover)}
.who{font-size:13px;color:var(--faint);padding:0 6px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:620px){.nav{padding:10px 14px}.brand-name{font-size:17px}.nav a.ghost,.nav .ghostbtn{padding:7px 8px;font-size:13.5px}.who{display:none}.nav a.opt{display:none}}
/* ---------- public hero ---------- */
.hero{padding:64px 20px 56px;border-bottom:1px solid var(--whisper)}
.hero-in{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
@media(max-width:820px){.hero-in{grid-template-columns:1fr;gap:32px}.hero{padding:40px 20px}}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-ink)}
.hero h1{font-family:var(--serif);font-weight:500;font-size:clamp(34px,5.4vw,56px);line-height:1.06;letter-spacing:-.02em;margin:14px 0 16px;max-width:15ch}
.hero h1 em{font-style:normal;color:var(--accent-ink);background:linear-gradient(transparent 72%,var(--gold-tint) 72%)}
.hero p{font-size:17px;color:var(--muted);max-width:50ch;margin:0 0 26px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap}
.hero .cta a{text-decoration:none;padding:12px 22px;border-radius:9px;font-weight:600;font-size:15px}
.cta .primary{background:var(--accent);color:var(--on-accent)}
.cta .primary:hover{background:var(--accent-hover)}
.cta .secondary{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line-2) inset}
.cta .secondary:hover{box-shadow:0 0 0 1px var(--accent-ink) inset}
.hero .count{margin-top:22px;font-size:13px;color:var(--faint)}
.hero-card{background:var(--surface);border:1px solid var(--whisper);border-radius:16px;box-shadow:var(--shadow-deep);padding:22px;position:relative}
.hero-card .mini{border:1px solid var(--whisper);border-radius:10px;padding:13px 14px;margin-top:10px;background:var(--canvas)}
.hero-card .mini b{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}.hero-card .mini p{font-size:12.5px;color:var(--muted);margin:2px 0 0}
.stamp{position:absolute;top:-12px;right:18px;background:var(--gold);color:#3a2f14;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
.how{padding:34px 20px}
.how-inner{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:700px){.how-inner{grid-template-columns:1fr;gap:12px}}
.how-item{font-size:14px;background:var(--surface);border:1px solid var(--whisper);border-radius:12px;padding:18px 18px 16px}
.how-item .n{font-family:var(--serif);color:var(--accent-ink);font-size:14px;margin-right:6px}
.how-item b{font-weight:600}
.how-item p{color:var(--muted);font-size:13.5px;margin-top:6px}
/* ---------- signed-in app layout (Notion-style sidebar) ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);max-width:1180px;margin:0 auto;min-height:calc(100vh - 60px)}
.side{border-right:1px solid var(--whisper);padding:18px 12px;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto}
.side nav{display:flex;flex-direction:column;gap:1px}
.side .grp{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px}
.side a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink-2);font-size:14.5px;font-weight:500;padding:7px 10px;border-radius:7px}
.side a:hover{background:var(--whisper);color:var(--ink)}
.side a.on{background:var(--sand);color:var(--ink)}
.side a.on .ic{color:var(--accent-ink)}
.side .count{margin-left:auto;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
.side .tip{margin:18px 6px 0;font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--whisper);border-radius:10px;padding:12px}
.side .tip a{display:inline;padding:0;font-size:inherit;font-weight:600;color:var(--accent-ink);text-decoration:underline;text-underline-offset:2px}
.side .tip a:hover{background:none}
.main{padding:8px 32px 40px;min-width:0}
.main .wrap{max-width:none;padding:0}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;border-right:none;border-bottom:1px solid var(--whisper);padding:8px 10px}
.side nav{flex-direction:row;overflow-x:auto;gap:4px;scrollbar-width:none}.side nav::-webkit-scrollbar{display:none}.side .grp,.side .tip{display:none}
.side a{white-space:nowrap;padding:7px 10px;font-size:14px}.main{padding:4px 16px 36px}}
/* ---------- page heads (Kami numbered section) ---------- */
.page-head{margin:26px 0 22px}
.page-head .num{font-family:var(--serif);font-size:14px;color:var(--accent-ink);letter-spacing:.03em}
.page-head h1,h2.page{font-family:var(--serif);font-weight:500;font-size:clamp(26px,3.2vw,32px);line-height:1.18;letter-spacing:-.015em;color:var(--ink);margin:6px 0 6px}
h2.page{margin:28px 0 8px}
.page-head p,.lead{color:var(--muted);font-size:15.5px;margin-bottom:22px;max-width:62ch}
.page-head p{margin-bottom:0}
h3.sec{font-family:var(--serif);font-weight:500;font-size:19px;margin:28px 0 10px;letter-spacing:-.005em}
h3.sec small{font-family:var(--sans);font-size:13px;color:var(--faint);font-weight:400;margin-left:6px}
/* ---------- cards, bento ---------- */
.card{background:var(--surface);border:1px solid var(--whisper);border-radius:12px;padding:18px 20px;transition:box-shadow .2s}
.card+.card{margin-top:12px}
.card.lift:hover{box-shadow:var(--shadow)}
.bento{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin:6px 0 20px}
.tile{background:var(--surface);border:1px solid var(--whisper);border-radius:14px;padding:18px 18px 16px;grid-column:span 2;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile.tall{grid-row:span 2}.tile.w3{grid-column:span 3}.tile.w4{grid-column:span 4}.tile.w6{grid-column:span 6}
.tile.tint{background:var(--accent-tint);border-color:transparent}
.tile.goldt{background:var(--gold-tint);border-color:transparent}
.tile h3{font-family:var(--serif);font-weight:500;font-size:18px;letter-spacing:-.005em;display:flex;align-items:center;gap:8px}
.tile h3 .ic{color:var(--accent-ink)}
.tile p{color:var(--muted);font-size:13.5px}
.tile .big{font-family:var(--serif);font-size:38px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.tile .foot{margin-top:auto;padding-top:6px}
@media(max-width:900px){.bento{grid-template-columns:repeat(2,minmax(0,1fr))}.tile,.tile.w3,.tile.w4,.tile.w6{grid-column:span 2}.tile.tall{grid-row:auto}}
.meter{height:7px;background:var(--sand);border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
.meter.ok i{background:var(--ok)}.meter.warn i{background:var(--warn)}.meter.bad i{background:var(--bad)}
/* ---------- buttons ---------- */
.b{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:8px;padding:9px 15px;font:600 14px/1.2 var(--sans);cursor:pointer;text-decoration:none;background:var(--accent);color:var(--on-accent);transition:background .15s,box-shadow .15s}
.b:hover{background:var(--accent-hover)}
.b.sec{background:var(--sand);color:var(--ink)}.b.sec:hover{background:var(--line-2)}
.b.ghost{background:transparent;color:var(--accent-ink);box-shadow:0 0 0 1px var(--line-2) inset}.b.ghost:hover{box-shadow:0 0 0 1px var(--accent-ink) inset;background:transparent}
.b.danger{background:transparent;color:var(--bad);box-shadow:0 0 0 1px var(--line-2) inset}.b.danger:hover{background:var(--bad-tint)}
.b.sm{padding:6px 11px;font-size:13px;border-radius:7px}
.b[disabled]{opacity:.55;cursor:not-allowed}
.submit-btn,.apply-btn{display:inline-block;background:var(--accent);color:var(--on-accent);border:none;border-radius:8px;padding:12px 24px;font:600 15px/1.2 var(--sans);cursor:pointer;text-decoration:none}
.submit-btn:hover,.apply-btn:hover{background:var(--accent-hover)}
.linkbtn{background:none;border:none;color:var(--accent-ink);text-decoration:underline;cursor:pointer;font:inherit;padding:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack>*+*{margin-top:10px}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}
/* ---------- pills, chips, badges ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sand);color:var(--ink-2);white-space:nowrap;letter-spacing:.01em}
.pill.accent{background:var(--accent-tint);color:var(--accent-ink)}
.pill.gold{background:var(--gold-tint);color:var(--gold-ink)}
.pill.ok{background:var(--ok-tint);color:var(--ok)}.pill.warn{background:var(--warn-tint);color:var(--warn)}.pill.bad{background:var(--bad-tint);color:var(--bad)}.pill.info{background:var(--info-tint);color:var(--info)}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:500;box-shadow:0 0 0 1px var(--whisper) inset}
.badge{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.badge.verified{background:var(--ok-tint);color:var(--ok)}
.badge.warning{background:var(--warn-tint);color:var(--warn)}
.badge.held{background:var(--bad-tint);color:var(--bad)}
/* ---------- jobs ---------- */
.controls{margin:22px 0 8px}
.searchbar{display:flex;gap:8px;margin-bottom:14px}
.searchbar input{flex:1}
.searchbar button{background:var(--accent);color:var(--on-accent);border:none;border-radius:8px;padding:0 20px;font-weight:600;font-size:14px;cursor:pointer}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.filter-row .label{font-size:11px;color:var(--faint);font-weight:600;align-self:center;margin-right:4px;text-transform:uppercase;letter-spacing:.08em}
.chipf{background:var(--surface);color:var(--muted);padding:5px 12px;border-radius:999px;font-size:13px;text-decoration:none;font-weight:500;box-shadow:0 0 0 1px var(--whisper) inset}
.chipf:hover{color:var(--ink)}
.chipf.active{background:var(--ink);color:var(--canvas);box-shadow:none}
.results-head{font-size:13px;color:var(--faint);margin:18px 0 10px}
.job{background:var(--surface);border:1px solid var(--whisper);border-radius:12px;padding:16px 18px;margin-bottom:10px;text-decoration:none;color:inherit;display:block;transition:box-shadow .2s,border-color .2s}
.job:hover{box-shadow:var(--shadow);border-color:var(--line-2)}
.job-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.job-title{font-family:var(--serif);font-weight:500;font-size:18px;color:var(--ink);letter-spacing:-.005em}
.job-co{color:var(--muted);font-size:14px;margin-top:1px}
.job-meta{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.why{font-size:13px;color:var(--ok);margin-top:8px}
.empty{text-align:center;color:var(--muted);padding:48px 20px;font-size:15px;background:var(--surface);border:1px dashed var(--line-2);border-radius:12px}
.detail-desc{white-space:pre-wrap;margin:18px 0;font-size:15px;line-height:1.7;max-width:70ch}
.finding{border-left:2px solid var(--line-2);padding:5px 0 5px 12px;margin:8px 0;font-size:13.5px}
.finding.critical{border-color:var(--bad)}.finding.warning{border-color:var(--warn)}.finding.note{border-color:var(--faint)}
.finding b{font-weight:600}
.back{color:var(--muted);text-decoration:none;font-size:14px;display:inline-block;margin:22px 0 6px}
.back:hover{color:var(--ink)}
/* ---------- banners ---------- */
.banner{border-radius:10px;padding:13px 15px;margin-bottom:18px;font-size:14px;border:1px solid transparent}
.banner.verified{background:var(--ok-tint);color:var(--ok)}
.banner.warning{background:var(--warn-tint);color:var(--warn)}
.banner.held{background:var(--bad-tint);color:var(--bad)}
.banner.info{background:var(--info-tint);color:var(--info)}
/* ---------- forms ---------- */
.form-field{margin-bottom:16px}
label{display:block;font-size:14px;font-weight:600;margin-bottom:5px}
.hint{font-size:13px;color:var(--muted);margin-bottom:7px}
input,textarea,select{width:100%;border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;font-family:inherit;font-size:15px;background:var(--surface);color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent-ink);box-shadow:0 0 0 3px var(--accent-tint)}
textarea{min-height:140px;resize:vertical;line-height:1.55}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}
.checks{display:flex;flex-wrap:wrap;gap:7px}
.chk{position:relative}
.chk input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chk span{display:inline-block;font-size:13.5px;font-weight:500;padding:6px 12px;border-radius:999px;background:var(--surface);box-shadow:0 0 0 1px var(--line-2) inset;color:var(--ink-2);cursor:pointer}
.chk input:checked+span{background:var(--accent);color:var(--on-accent);box-shadow:none}
.chk input:focus-visible+span{outline:2px solid var(--accent-ink);outline-offset:2px}
.toggle{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:14.5px;margin-bottom:12px}
.toggle input{margin-top:4px}
.toggle b{font-weight:600}
.steps{display:flex;gap:6px;margin:6px 0 22px}
.steps span{flex:1;height:4px;border-radius:999px;background:var(--sand)}
.steps span.on{background:var(--accent)}
.stepname{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
.navform{display:inline;margin:0}
.inline-form{margin:0 0 14px;display:block}
.counter{font-size:12px;color:var(--faint);text-align:right;margin-top:4px}
/* ---------- auth ---------- */
.auth{max-width:440px;margin:36px auto 12px;background:var(--surface);border:1px solid var(--whisper);border-radius:16px;padding:30px 28px;box-shadow:var(--shadow)}
.auth-title{font-family:var(--serif);font-weight:500;font-size:28px;text-align:center;color:var(--ink);margin-bottom:6px}
.auth.start{text-align:center;padding-top:34px}.auth.start .form-field{text-align:left}
.startmark{width:56px;height:56px;margin:0 auto 14px;display:grid;place-items:center;border-radius:14px;background:var(--accent-tint)}
.startmark svg{width:34px;height:34px}.start-foot{margin-top:18px;font-size:14px;color:var(--muted)}.start-foot a{color:var(--accent-ink);font-weight:600}
.auth-sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:18px}
.tabs{display:flex;gap:4px;background:var(--sunk);border-radius:10px;padding:4px;margin:16px 0 22px;box-shadow:0 0 0 1px var(--whisper) inset}
.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:14px;font-weight:600;padding:8px 10px;border-radius:7px}
.tabs a.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.label-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.forgot{font-size:14px;color:var(--accent-ink);margin-bottom:5px}
.pwbox{position:relative}
.pwbox input{padding-right:64px}
.showpw{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:6px 8px}
.rules{list-style:none;padding:0;margin:-6px 0 16px;font-size:13px;color:var(--muted);display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}
.rules li::before{content:"○ "}
.rules li.ok{color:var(--ok)}.rules li.ok::before{content:"✓ "}
.submit-btn.wide,.outline-btn{display:block;width:100%;text-align:center;text-decoration:none}
.fine{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}

<script>var NCS_RULEPACK = {"version":"2026.09.29.2","rules":[{"id":"advance_fee","status":"active","severity":"critical","weight":30,"title":"You're asked to pay something","why":"Legitimate employers never charge you to start work. The single most reliable scam marker.","phrases":["training fee","registration fee","application fee","processing fee","onboarding fee","background check fee","starter kit","pay for your own equipment","purchase the equipment","buy the software","refundable deposit","security deposit","administrative fee","certification fee","check to purchase","check for equipment","check to buy","funds to purchase","money for equipment","training with a fee"],"patterns":["\\b(?:fees?|tuition|charges?)\\b[^.\\n]{0,40}\\b(?:training|course|program|certification|onboarding|registration|processing|kit|equipment|softwares?|laptop|visa)\\b","\\b(?:training|course|program|certification|onboarding|registration|application|processing|visa|equipment|software|kit)\\s+(?:fees?|charges?|tuition|costs?)\\b","\\$\\s?\\d[\\d,]*(?:\\.\\d\\d)?\\s+(?:paid\\s+)?(?:certification|training|course|program|mentorship|kit|software|equipment)\\b","\\b(?:must|need to|have to|required to|first)\\b[^.\\n]{0,30}\\b(?:obtain|purchase|buy|pay(?: for)?)\\b[^.\\n]{0,30}\\$\\s?\\d[\\d,]*[^.\\n]{0,20}\\b(?:certification|training|course|program|onboarding|software|equipment|vendor|kit|fee)\\b","\\b(?:pay|paying|send)\\s+(?:the\\s+|our\\s+|an?\\s+)?(?:vendor|hr agent|agent|recruiter|supplier)\\b[^.\\n]{0,40}\\$?\\s?\\d","\\bpay\\b[^.\\n]{0,40}\\$\\s?\\d[\\d,]*[^.\\n]{0,40}\\b(?:to our|to the)\\s+(?:hr\\s+)?(?:agent|recruiter|manager|vendor)\\b","\\b(?:are you able to|can you|could you|please|kindly|you (?:will )?(?:need to|must|have to))\\s+(?:\\w+\\s+){0,2}(?:cover|front|pay for)\\s+(?:the\\s+|these\\s+|those\\s+)?(?:expenses?|costs?|fees?)\\b"],"guards":["negation"],"min_matches":1,"bonus":3,"added":"2026-09-29","source":"original"},{"id":"money_mule","status":"active","severity":"critical","weight":34,"title":"The job involves moving money or packages","why":"Depositing checks and forwarding funds, or reshipping parcels, is how stolen money and goods get laundered.","phrases":["deposit the check","cash the check","cashier's check","cashiers check","forward the funds","transfer the remaining","wire the balance","process payments on behalf","package forwarding","reship","money transfer agent"],"patterns":["\\b(?:mail|send|issue|email|deliver|give)\\w*\\s+you\\s+(?:a\\s+|the\\s+)?(?:check|cheque|paycheck)\\b[^.\\n]{0,90}\\b(?:deposit|purchase|equipment|supplies|expenses|software|vendor)\\b","\\b(?:attached|enclosed)\\s+is\\s+the\\s+(?:pay)?check\\b[^.\\n]{0,60}\\b(?:cover|expenses|supplies|purchase)\\b","\\bkeep\\s+(?:\\$\\s?\\d[\\d,]*|\\d{1,3}\\s?%)[^.\\n]{0,60}\\b(?:pay|salary|commission|fee|cut)\\b","\\b(?:customers?|clients?|buyers?)\\s+(?:will\\s+)?(?:pay|send|deposit)\\s+(?:into|to)\\s+your\\s+(?:personal\\s+|own\\s+)?(?:bank\\s+)?account\\b","\\b(?:transfer|send|wire|forward|remit)\\b[^.\\n]{0,40}\\b\\d{1,3}\\s?%[^.\\n]{0,40}\\b(?:partner|account|us|our|company)\\b","\\b(?:receive|accept|inspect)\\s+(?:the\\s+)?(?:parcels?|packages?|shipments?|boxes|goods)\\b[^.\\n]{0,80}\\b(?:your\\s+(?:home\\s+)?address|your\\s+home|at\\s+home|residence)\\b","\\b(?:relabel|re-?label|repackage|re-ship)\\w*\\b","\\bprepaid\\s+(?:shipping\\s+)?labels?\\b"],"guards":[],"min_matches":1,"bonus":3,"added":"2026-09-29","source":"original"},{"id":"mystery_shopping","status":"active","severity":"warning","weight":16,"title":"Mystery-shopper work","why":"Real mystery shopping exists, but 'mystery shopper' is also the usual cover story for fake-check scams. Never deposit a check or send money as part of an assignment.","phrases":["mystery shopper","secret shopper","mystery shopping"],"patterns":[],"guards":[],"min_matches":1,"bonus":3,"added":"2026-09-29","source":"original"},{"id":"banking_pii","status":"active","severity":"critical","weight":26,"title":"Banking or identity details wanted up front","why":"Account and identity details come after a signed offer, through payroll, never over chat during screening.","phrases":["routing number","bank account number","voided check","social security number","your ssn","driver's license number","drivers license number","copy of your id","photo of your id","direct deposit form"],"patterns":["\\b(?:send|provide|share|text|email|upload|scan|snap|attach)\\b[^.\\n]{0,50}\\b(?:ssn|social security|driver'?s? licen[sc]e|passport|bank (?:account|details|info\\w*|login)|routing|account number|photo id|id card)\\b"],"guards":["negation","post_hire"],"min_matches":1,"bonus":3,"added":"2026-09-29","source":"original"},{"id":"irreversible_pay","status":"active","severity":"critical","weight":24,"title":"Payment through irreversible channels","why":"Gift cards, crypto and wire services can't be reversed or traced, and no payroll pays in them. Being asked to SEND money through Zelle, Cash App or Venmo is the same trap. (Small gigs paying you through PayPal or Venmo is common and is not flagged on its own.)","phrases":[],"patterns":["\\b(?:send|sent|deposit|transfer|buy|purchase|codes?|top\\s?up|recharge|wire|withdraw\\w*|reimburse\\w*|pay\\s+(?:for|us|them|the|a|your|back))\\b[^.\\n]{0,40}\\b(?:bitcoin|btc|usdt|usdc|crypto(?:currency)?|gift\\s+cards?|apple\\s+cards?|itunes|zelle|cash\\s?app|venmo|western\\s+union|moneygram)\\b","\\b(?:paid|payment|payments|salary|wages?|pay)\\b[^.\\n]{0,40}\\b(?:bitcoin|btc|usdt|usdc|crypto(?:currency)?|gift\\s+cards?|apple\\s+cards?|itunes|western\\s+union|moneygram)\\b","\\b(?:bitcoin|btc|usdt|usdc|crypto(?:currency)?|gift\\s+cards?|apple\\s+cards?|itunes|western\\s+union|moneygram)\\b[^.\\n]{0,25}\\b(?:paid|payment|payments|salary|deposit|transfer|codes?)\\b"],"guards":["negation"],"min_matches":1,"bonus":3,"added":"2026-09-29","source":"original","history":[{"date":"2026-09-30","change":"stopped flagging P2P apps used to PAY the worker (false positives on a real mystery-shop audit and a real promoter gig in the Sept 2026 field test); still flags sending money through them and pay in gift cards/crypto/wire","previous_patterns":["\\b(?:pay|paid|payment|payments|salary|send|sent|deposit|transfer|buy|purchase|codes?|top\\s?up|recharge|wire|withdraw\\w*)\\b[^.\\n]{0,40}\\b(?:bitcoin|btc|usdt|usdc|crypto(?:currency)?|gift\\s+cards?|apple\\s+cards?|itunes|zelle|cash\\s?app|venmo|western\\s+union|moneygram)\\b","\\b(?:bitcoin|btc|usdt|usdc|crypto(?:currency)?|gift\\s+cards?|apple\\s+cards?|itunes|zelle|cash\\s?app|venmo|western\\s+union|moneygram)\\b[^.\\n]{0,25}\\b(?:paid|payment|payments|salary|deposit|transfer|codes?)\\b"]}]},{"id":"task_scam","status":"active","severity":"warning","weight":24,"title":"Looks like a 'task' scam","why":"Task scams pay small commissions for fake product-boosting work, then demand deposits to 'unlock' withdrawals. You never get the money back.","phrases":[],"patterns":["\\b(?:boost|increase|improve|raise)\\w*\\s+(?:the\\s+)?(?:product\\s+|app\\s+|merchant\\s+|store\\s+)?(?:ratings?|rankings?|reviews?)\\b","\\b(?:product|order|app)\\s+optimi[sz]ation\\b","\\bcommission\\s+(?:on|per|for)\\s+(?:every|each|all)\\s+(?:set|task|order|product)\\b","\\b(?:top\\s?up|recharge|reload|fund)\\s+(?:your\\s+)?(?:account|balance|wallet)\\b","\\bunlock\\s+(?:your\\s+)?(?:withdrawal|earnings|commissions?|tasks?|bonus)\\b","\\bwithdraw(?:al|als)?\\b[^.\\n]{0,50}\\b(?:top\\s?up|recharge|deposit|unlock|upgrade)\\b","\\b(?:like|rate|review|click)\\s+(?:and\\s+\\w+\\s+)?(?:products?|videos?|ads?|apps?|listings?)\\b[^.\\n]{0,40}\\b(?:earn|paid|commission)\\b"],"guards":[],"min_matches":1,"bonus":3,"added":"2026-09-29","source":"original"},{"id":"off_platform","status":"active","severity":"warning","weight":17,"title":"Pushed onto a messaging app","why":"Moving to an unmonitored app right away avoids platform fraud detection and leaves no record.","phrases":["telegram","whatsapp","google hangouts","signal app","wickr","skype id","add me on","message me at","text me at","dm me on"],"patterns":["\\b(?:provide|send|share)\\s+(?:us\\s+|me\\s+)?your\\s+(?:microsoft\\s+)?teams\\s+(?:contact|id|email|username|handle|details)\\b","\\bteams\\s+for\\s+(?:direct\\s+)?communication\\b","\\b(?:only|exclusively|just)\\s+(?:via|on|through|over)\\s+(?:whatsapp|telegram|signal|text|sms)\\b"],"guards":["negation"],"min_matches":1,"bonus":3,"added":"2026-09-29","source":"original"},{"id":"text_interview","status":"active","severity":"warning","weight":15,"title":"Interview by text only","why":"Scam operations avoid live video because they're using a stolen or invented identity.","phrases":["chat interview","text interview","no video call","interview through telegram","interview via whatsapp","written interview only"],"patterns":["\\binterview\\w*\\b[^.\\n]{0,40}\\b(?:via|on|through|over|by)\\s+(?:whatsapp|telegram|signal|text(?:\\s+message)?|chat|messages?|sms)\\b"],"guards":["negation"],"min_matches":1,"bonus":3,"added":"2026-09-29","source":"original"},{"id":"instant_hire","status":"active","severity":"warning","weight":16,"title":"Hired with no real process","why":"An offer without an interview means nobody is assessing you. The goal is to reach the payment step fast.","phrases":["you have been hired","congratulations you are hired","no interview required","hired on the spot","your resume was selected","begin work today"],"patterns":["\\bno\\s+interview\\b","\\b(?:hired|hire[sd]?|start(?:ing)?|begin)\\b[^.\\n]{0,20}\\bsame[- ]day\\b","\\byou(?:'ve| have)\\s+been\\s+(?:selected|hired|approved|accepted)\\b","\\bdeemed\\s+qualified\\b","\\byour\\s+(?:application|resume)\\s+(?:has\\s+been|was)\\s+(?:processed|selected|approved|shortlisted)\\b"],"guards":["negation"],"min_matches":1,"bonus":3,"added":"2026-09-29","source":"original"},{"id":"unsolicited_contact","status":"active","severity":"warning","weight":14,"title":"They say they found you through a directory or resume list","why":"Scammers mass-mail lists of students and job seekers. A real employer applies to you, or you apply to them.","phrases":[],"patterns":["\\b(?:got|received|obtained|found|pulled|saw)\\s+your\\s+(?:contact|resume|cv|email|details|information)\\b[^.\\n]{0,60}\\b(?:through|from|via|on|in)\\b","\\bselected\\s+from\\s+your\\s+(?:school|university|college|campus)\\s+directory\\b","\\byour\\s+(?:school|university|college)\\s+(?:directory|email\\s+list|listserv)\\b"],"guards":[],"min_matches":1,"bonus":3,"added":"2026-09-29","source":"university scam alerts, 2026-09"},{"id":"student_bait","status":"active","severity":"note","weight":9,"title":"Wording aimed at students","why":"Campus scam alerts repeatedly show this framing: easy money that won't interfere with classes.","phrases":[],"patterns":["\\bwithout affecting your (?:regular\\s+)?(?:activities|studies|academics|classes|schedule)\\b","\\bstudent\\s+(?:empowerment|assistance|support)\\s+program\\b","\\bwork\\s+virtually\\s+as\\b"],"guards":[],"min_matches":1,"bonus":3,"added":"2026-09-29","source":"university scam alerts, 2026-09"},{"id":"pressure","status":"active","severity":"warning","weight":11,"title":"Pressure to decide now","why":"Urgency is there to stop you checking. Real hiring runs on weeks, not hours.","phrases":["limited positions","limited slots","act fast","respond within 24 hours","within the next hour","first come first served","offer expires","urgent hiring","urgently needed"],"patterns":["\\burgently\\s+(?:needs?|required|hiring)\\b","\\bstart\\s+(?:today|now|right away)\\b"],"guards":[],"min_matches":1,"bonus":3,"added":"2026-09-29","source":"original"},{"id":"too_good","status":"active","severity":"warning","weight":13,"title":"High pay for very little","why":"Pay well above market for a role needing no experience is bait, not an opportunity.","phrases":["no experience necessary","no experience required","no skills required","anyone can do this","work only 2 hours","flexible hours high pay","easy money","guaranteed income","earn while you learn"],"patterns":["\\bno\\s+(?:prerequisite\\s+)?(?:training\\s+or\\s+)?(?:work\\s+)?experience(?:\\s+or\\s+(?:skills?|training))?\\s+(?:is\\s+|are\\s+)?(?:necessary|required|needed)\\b","\\bearn\\s+\\$\\s?\\d[\\d,]*(?:\\s*(?:-|to)\\s*\\$?\\s?\\d[\\d,]*)?\\s*(?:daily|a day|per day|every day)\\b"],"guards":[],"min_matches":1,"bonus":3,"added":"2026-09-29","source":"original","history":[{"date":"2026-09-30","change":"also match 'no prerequisite training or experience needed' (missed in the Sept 2026 field test)","previous_pattern":"\\bno\\s+(?:work\\s+)?experience(?:\\s+or\\s+skills?)?\\s+(?:is\\s+|are\\s+)?(?:necessary|required|needed)\\b"}]},{"id":"pay_to_work","status":"active","severity":"warning","weight":20,"title":"The 'job' requires paying for training first","why":"A real internship or job pays you. If you must buy a course or program to get the role, it is a course sale dressed as a job.","phrases":["enroll here","enroll for the program","enroll in the program"],"patterns":["\\benroll\\w*\\s+(?:for|in)\\s+(?:the|our)\\s+(?:training\\s+)?program\\b"],"guards":["negation"],"min_matches":1,"bonus":3,"added":"2026-09-29","source":"original"},{"id":"training_sale_perks","status":"active","severity":"warning","weight":20,"title":"The perks read like a course being sold","why":"Certificates, mock interviews and branding sessions listed together are how paid 'internship programs' advertise themselves.","phrases":["training certificate","internship certificate","letter of recommendation","mock interview sessions","personal branding sessions","resume building sessions","guaranteed placement"],"patterns":[],"guards":[],"min_matches":2,"bonus":3,"added":"2026-09-29","source":"original"},{"id":"mule_recruitment","status":"active","severity":"warning","weight":22,"title":"Bank account and ID wanted to 'receive payment'","why":"Being asked for a U.S. bank account and SSN to 'receive salary' before you know the job, company, or pay is the money-mule recruitment pattern; your account is used to move stolen funds.","phrases":["bank account for payment","valid u.s. bank account","us bank account for","social security number for employment","part-time recruiter"],"patterns":["\\b(?:valid|active|personal)\\s+(?:u\\.?s\\.?\\s+)?bank\\s+account\\b[^.\\n]{0,30}\\b(?:payment|paid|salary|deposit|receive)\\b","\\b(?:receive|get|accept)\\s+(?:your\\s+)?(?:salary|pay|payments?|payroll)(?:\\s+payments?)?\\s+(?:through|via|by|into|to)\\s+(?:a\\s+|your\\s+)?(?:u\\.?s\\.?\\s+)?(?:personal\\s+)?bank\\b","\\bassist(?:ing)?\\s+(?:\\w+\\s+){0,3}with\\s+(?:its|our|their|the)\\s+recruit(?:ment|ing)\\b","\\brecruit(?:ment|ing)\\s+(?:is\\s+being\\s+)?conducted\\s+on\\s+behalf\\s+of\\b","\\breply\\s+(?:with\\s+)?(?:yes|apply|interested|i'?m interested)\\b","\\bnot\\s+eligible\\s+to\\s+apply\\b"],"guards":[],"min_matches":1,"bonus":3,"added":"2026-09-29","source":"original"},{"id":"vague_employer","status":"active","severity":"note","weight":9,"title":"The employer stays vague","why":"A real posting names the company and a real person. Anonymity here is deliberate.","phrases":["confidential company","our client is seeking","a leading company","reputable company seeking","well known firm","undisclosed company"],"patterns":["\\b(?:confidential|undisclosed)\\s+(?:employer|company|client)\\b"],"guards":[],"min_matches":1,"bonus":3,"added":"2026-09-29","source":"original"},{"id":"preselected_offer","status":"active","severity":"warning","weight":20,"title":"A job offer you never applied for","why":"The message says you've already been 'chosen' or 'selected' or that an offer was 'approved for you', or that they found your CV or email somewhere. Real employers don't hand out offers to people who never applied.","phrases":[],"patterns":["\\b(?:dear|greetings,?|hello,?)\\s+(?:chosen|selected)\\s+(?:applicant|candidate|student)s?\\b","\\b(?:job\\s+)?offer\\s+has\\s+been\\s+approved\\s+for\\s+you\\b","\\byou\\s+have\\s+been\\s+(?:chosen|selected)\\s+(?:through|by|from|for\\s+(?:a|this)\\s+job|to\\s+work)\\b","\\b(?:considered|found)\\s+you\\s+(?:as\\s+)?(?:a\\s+)?suitable\\b","\\bcame\\s+across\\s+your\\s+(?:cv|resume|profile)\\b","\\bfound\\s+your\\s+(?:email|e-mail|contact|number)\\s+(?:on|in|through)\\b","\\byou\\s+are\\s+invited\\s+to\\s+participate\\s+in\\s+a\\s+part[- ]time\\s+job\\b","\\byour\\s+resume\\s+is\\s+very\\s+suitable\\b"],"guards":[],"min_matches":1,"bonus":3,"added":"2026-09-30","source":"field test Sept 2026 (Evan's labeled reasons)"},{"id":"weekly_stipend","status":"active","severity":"warning","weight":18,"title":"A flat weekly amount for part-time work","why":"Scam offers quote a round weekly sum ('$350 weekly', '$550 per week') for a few hours of vague remote work. Real part-time jobs quote an hourly rate.","phrases":[],"patterns":["\\$\\s?\\d{3}(?:[.,]\\d{2})?\\s*(?:\\(?usd\\)?\\s*)?(?:weekly|per\\s+week|a\\s+week|each\\s+week|every\\s+week|/\\s?(?:week|wk))\\b","\\bweekly\\s+(?:pay|salary|remuneration|allowance|wages?|compensation|stipend)\\s*(?:of|:|is)?\\s*(?:up\\s+to\\s+)?\\$\\s?\\d{3}\\b","\\b(?:earn|make|get\\s+paid)\\s+(?:up\\s+to\\s+)?\\$\\s?\\d{3}(?:\\.\\d\\d)?\\s*(?:\\(?usd\\)?\\s*)?weekly\\b"],"guards":[],"min_matches":1,"bonus":3,"added":"2026-09-30","source":"field test Sept 2026 (Evan's labeled reasons)"},{"id":"personal_channel","status":"active","severity":"warning","weight":18,"title":"Moves hiring to a personal phone, email or social account","why":"You're told to text a number, reply from your personal or 'alternative' email instead of your school address, or message someone on Instagram. That keeps the conversation away from your school's spam filters and anyone who could warn you.","phrases":[],"patterns":["\\b(?:alternative|alternate|personal|private|non[- ]?school|non[- ]?edu)\\s+e-?mail(?:\\s+address)?\\b","\\bnot\\s+(?:your|the)\\s+(?:\\.?edu|school|university|student|campus)\\s+e-?mail\\b","\\btext\\s+(?:your|me\\s+your|us\\s+your|them\\s+your)\\s+(?:full\\s+)?name\\b","\\b(?:send|drop)\\s+(?:a\\s+)?text(?:\\s+message)?\\s+to\\b","\\bvia\\s+text\\s+(?:message|at)\\b","\\btext\\s+message\\s+(?:only|for\\s+a\\s+quick)\\b","\\binstagram\\b[^.\\n]{0,40}\\bmessage\\s+only\\b","\\bdrop\\s+your\\s+(?:phone|cell|mobile)\\s+number\\b","\\b(?:send|provide|reply\\s+with)\\b[^.\\n]{0,40}\\bgmail\\b"],"guards":[],"min_matches":1,"bonus":3,"added":"2026-09-30","source":"field test Sept 2026 (Evan's labeled reasons)"},{"id":"any_department","status":"active","severity":"note","weight":10,"title":"Open to anyone in any department","why":"Fake 'research assistant' offers say any student from any department can do the job. Real research jobs name the skills and the lab.","phrases":[],"patterns":["\\b(?:any|all)\\s+(?:academic\\s+)?departments?\\s+(?:of|in)\\s+(?:the|our)\\s+(?:institution|university|school|college)\\b","\\bfrom\\s+any\\s+(?:academic\\s+)?department\\b","\\bstudents?\\s*(?:and|/|\\\\)\\s*staffs?\\b[^.\\n]{0,80}\\b(?:job|position|opportunity|offer|employment)\\b"],"guards":[],"min_matches":1,"bonus":3,"added":"2026-09-30","source":"field test Sept 2026 (Evan's labeled reasons)"},{"id":"student_hardship_bait","status":"active","severity":"note","weight":10,"title":"Promises money without touching your studies","why":"'Won't interfere with your academics', 'help struggling students cover expenses': this pitch targets students who need money and is written to lower your guard.","phrases":[],"patterns":["\\bwithout\\s+(?:affecting|interfering\\s+with)\\s+(?:your|one'?s)\\s+(?:regular\\s+|daily\\s+)?(?:activities|academics?|academic\\s+performance|studies|classes|schedule|leisure)\\b","\\b(?:won'?t|will\\s+not|does\\s+not|doesn'?t)\\s+(?:interfere|affect)\\s+(?:with\\s+)?your\\s+(?:daily\\s+activities|academics|studies|present\\s+employment|study)\\b","\\bhelp\\s+(?:struggling|needy)\\s+students\\b","\\bcover\\s+expenses\\s+incurred\\b","\\bfinancial\\s+support\\s+to\\s+those\\s+who\\b"],"guards":[],"min_matches":1,"bonus":3,"added":"2026-09-30","source":"field test Sept 2026 (Evan's labeled reasons)"},{"id":"reship_home","status":"active","severity":"critical","weight":34,"title":"Receive and re-ship packages from home","why":"The job is taking in parcels at your home and sending them on. That's reshipping stolen goods, and you're the one whose address is on the box.","phrases":[],"patterns":["\\breshipp?(?:ing|er|ers)?\\b","\\b(?:parcels?|packages?|goods|items)\\b[^.\\n]{0,60}\\b(?:delivered|sent|shipped|mailed)\\s+to\\s+your\\s+(?:home|house|address|residence|apartment)\\b","\\bprepares?\\s+goods\\s+for\\s+forwarding\\b","\\baccept(?:ing)?\\s+and\\s+send(?:ing)?\\s+(?:mail|parcels?|packages?)\\b","\\b(?:outgoing|return)\\s+shipping\\s+labels?\\s+to\\s+print\\b","\\btake\\s+(?:pictures|photos)\\s+of\\s+(?:it|the\\s+parcels?|the\\s+packages?|each\\s+(?:parcel|package))\\b"],"guards":[],"min_matches":1,"bonus":3,"added":"2026-09-30","source":"field test Sept 2026 (Evan's labeled reasons)"},{"id":"fake_check_funds","status":"active","severity":"critical","weight":34,"title":"They'll send you money to buy things","why":"You're promised a check or 'funds' to buy equipment, supplies or gifts, or you'll be 'paid in advance' for purchases. The check bounces after you've spent or forwarded the money.","phrases":[],"patterns":["\\b(?:issue|send|mail|give|email)\\w*\\s+you\\s+(?:an?\\s+)?(?:official\\s+)?(?:check|cheque|paycheck)\\b","\\b(?:check|cheque|paycheck)\\s+(?:for|to\\s+cover)\\s+(?:the\\s+)?(?:office\\s+)?(?:supplies|equipment|expenses|purchases?|items)\\b","\\bfunds?\\b[^.\\n]{0,50}\\b(?:for|to\\s+(?:purchase|buy|handle|cover))\\s+(?:the\\s+)?(?:equipment|supplies|shipping|office\\s+items|gifts?|items)\\b","\\bmobile\\s+deposit\\b","\\bpurchase\\s+(?:gifts?|gift\\s+items)\\b","\\bnot\\s+to\\s+use\\s+your\\s+personal\\s+funds\\b","\\bdon'?t\\s+have\\s+to\\s+use\\s+your\\s+personal\\s+funds\\b","\\bpaid\\s+in\\s+advance\\s+for\\s+(?:all\\s+)?(?:tasks\\s+and\\s+)?purchases\\b","\\bsuppliers?\\ P.newmsg = () => {

function canStart(sender, to) {
  const u = U(to); if (!u || to === sender.id) return [false, "That account isn't available."];
  if (u.role === sender.role) return [false, "Messages are between students and employers."];
  if (sender.role === "student") return approvedEmp(to) ? [true, ""] : [false, "That employer hasn't been approved yet, so it can't receive messages."];
  if (!approvedEmp(sender.id)) return [false, "Messaging opens once a reviewer approves your organization. Open the reviewer view to approve it in the demo."];
  const p = SP(to); if (!studentReady(p) || !p.allow_messages) return [false, "That student isn't accepting messages from employers."];
  if (!p.visible && !S.convos.some(c => c.student === to && c.employer === sender.id)) return [false, "That student isn't accepting messages from employers."];
  return [true, ""];
}
const REPLIES = ["Thanks for reaching out! I'll take a look and get back to you by the end of the week.", "Great to hear from you. Could you send your resume through our careers page so HR has it on file?",
  "Thanks! Are you available for a quick 15-minute call Thursday or Friday afternoon?"];
function sendMessage(c, text) {
  const m = addMsg(c, me().id, text);
  if (m.status === "held") flash("warning", "Your message was held for a safety review because it matched scam patterns. A reviewer checks it before it's delivered.");
  else {
    const other = c.student === me().id ? c.employer : c.student;
    S.inbox.unshift({to: U(other).email, subject: "You have a new message on NoleCareerShield", body: `${who(me().id)[0]} sent you a message on NoleCareerShield.\n\nRead it on the site. We never put message text in emails, so an email that includes a "message" and asks you to reply is not from us.`, link: null});
    if (isStudent() && !c.blocked_by) S.timers.push(setTimeout(() => { if (S.convos.includes(c) && !c.blocked_by) { addMsg(c, c.employer, REPLIES[c.messages.length % REPLIES.length]); if (S.route.name === "messages" || S.route.name === "home") render(true); else nav(); } }, 2600));
  }
}

// ---------------- reading PDF and Word resumes in the browser ----------------
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
let pdfReady = null;
const loadScript = src => new Promise((ok, bad) => { const s = document.createElement("script"); s.src = src; s.crossOrigin = "anonymous"; s.onload = ok; s.onerror = () => bad(new Error("load")); document.head.appendChild(s); });
function loadPdfJs() {
  // pdf.worker loaded as a plain script lets pdf.js parse on the page itself, so no worker file has to be allowed.
  if (!pdfReady) { pdfReady = loadScript(PDFJS + "pdf.min.js").then(() => loadScript(PDFJS + "pdf.worker.min.js")).then(() => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js"; });
    pdfReady.catch(() => { pdfReady = null; }); }
  return pdfReady;
}
async function pdfText(buf) {
  try { await loadPdfJs(); } catch (e) { throw "The PDF reader didn't load (are you offline?). Paste the text instead."; }
  let doc;
  try { doc = await window.pdfjsLib.getDocument({data: new Uint8Array(buf), isEvalSupported: false, disableFontFace: true}).promise; }
  catch (e) { throw e && e.name === "PasswordException" ? "That PDF is password-protected. Export it again without a password, or paste the text." : "Couldn't read that PDF. Try exporting it again, or paste the text."; }
  if (doc.numPages > 6) throw "That PDF is longer than 6 pages. A student resume should be one page.";
  const lines = [];
  for (let i = 1; i <= doc.numPages; i++) {
    const tc = await (await doc.getPage(i)).getTextContent(); let line = "", lastY = null;
    for (const it of tc.items) {
      if (typeof it.str !== "string") continue;
      const y = it.transform[5];
      if (lastY !== null && Math.abs(y - lastY) > 2 && line.trim()) { lines.push(line); line = ""; }
      line += it.str; lastY = y;
      if (it.hasEOL) { lines.push(line); line = ""; lastY = null; }
    }
    if (line.trim()) lines.push(line);
  }
  return lines.join("\n");
}
const XML_ENT = {amp: "&", lt: "<", gt: ">", quot: '"', apos: "'"};
const unxml = s => s.replace(/&(#x[0-9a-f]+|#\d+|amp|lt|gt|quot|apos);/gi, (m, e) => e[0] === "#" ? String.fromCodePoint(parseInt(e[1] === "x" || e[1] === "X" ? e.slice(2) : e.slice(1), e[1] === "x" || e[1] === "X" ? 16 : 10)) : XML_ENT[e.toLowerCase()]);
async function docxText(buf) {
  // A .docx is a zip: find word/document.xml in the central directory, inflate it, keep the text (same as resume_engine._docx_text).
  const bad = "That file isn't a Word document (.docx).", u8 = new Uint8Array(buf), dv = new DataView(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw bad;
  const n = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true), entry = null;
  if (n > 400) throw "That document is too large to read.";
  const dec = new TextDecoder();
  for (let k = 0; k < n; k++) {
    if (p + 46 > u8.length || dv.getUint32(p, true) !== 0x02014b50) throw bad;
    const nl = dv.getUint16(p + 28, true), name = dec.decode(u8.subarray(p + 46, p + 46 + nl));
    if (name === "word/document.xml") entry = {method: dv.getUint16(p + 10, true), csize: dv.getUint32(p + 20, true), usize: dv.getUint32(p + 24, true), off: dv.getUint32(p + 42, true)};
    p += 46 + nl + dv.getUint16(p + 30, true) + dv.getUint16(p + 32, true);
  }
  if (!entry || dv.getUint32(entry.off, true) !== 0x04034b50) throw bad;
  if (entry.usize > 6 * 1024 * 1024) throw "That document is too large to read.";
  const start = entry.off + 30 + dv.getUint16(entry.off + 26, true) + dv.getUint16(entry.off + 28, true), data = u8.subarray(start, start + entry.csize);
  let xmlBytes;
  if (entry.method === 0) xmlBytes = data;
  else if (entry.method === 8 && typeof DecompressionStream !== "undefined") xmlBytes = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());

  const xml = dec.decode(xmlBytes), paras = [];
  for (const m of xml.matchAll(/<w:p[ >][\s\S]*?<\/w:p>|<w:p\/>/g)) {
    const para = m[0].replace(/<w:tab\/>/g, "\t").replace(/<w:br[^>]*\/>/g, "\n");
    paras.push((para.includes("<w:numPr>") ? "• " : "") + unxml([...para.matchAll(/<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>/g)].map(r => r[1]).join("")));
  }
  return paras.join("\n");
}
function cleanResumeText(t) {
  t = t.replace(/\r\n?/g, "\n").replace(/\t/g, "  ").replace(/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/g, "");
  t = t.replace(/[  ]+\n/g, "\n").replace(/^[  ]*[•▪●◦‣■□➢►–]\s*/gm, "• ").replace(/\n{3,}/g, "\n\n");
  return t.trim().slice(0, 20000);
}
// Resolves to the resume text, or rejects with a message for the student.
async function readResumeFile(file) {
  if (file.size > 2 * 1024 * 1024) throw "That file is larger than 2 MB.";
  const name = file.name.toLowerCase(), buf = await file.arrayBuffer(), head = new Uint8Array(buf.slice(0, 4));
  let text;
  if (name.endsWith(".pdf") || String.fromCharCode(...head) === "%PDF") text = await pdfText(buf);
  else if (name.endsWith(".docx") || (head[0] === 0x50 && head[1] === 0x4b)) text = await docxText(buf);
  else if (/\.(txt|md)$/.test(name)) text = new TextDecoder().decode(buf);
  else throw "Upload a PDF, a Word document (.docx), or a text file.";
  text = cleanResumeText(text);
  if (text.length < 80) throw name.endsWith(".pdf") ? "That PDF has almost no text we can read (it may be a scanned image). Paste the text instead." : "That's too short to be a resume. Paste the whole thing.";
  return text;
}

P.about = () => `${pageHead("About NoleCareerShield")}<div class="prose"><p>Students get targeted by fake job offers constantly: check-cashing schemes, money-mule "recruiters", and pay-to-work training programs. NoleCareerShield is a job board built around one question: <b>is this safe to respond to?</b></p>
<h3>How a listing gets on the board</h3><ul><li>Every submission is scored by an open, rule-based scam detector. Each rule that fires is explained in plain language, so the score is never a black box.</li><li>Every submission then waits for a human reviewer. Nothing is published automatically, no matter how clean the score.</li><li>Approved listings show their verdict. Listings that tripped signals are labeled and explain why.</li></ul>
<h3>Beyond the board</h3><ul><li><b>Profiles</b> that students control, including whether approved employers can find them.</li><li><b>Messaging</b> between students and reviewed employers, with every message scanned for scam signs.</li><li><b>A job assistant</b> that answers in plain words and only suggests listings that passed review.</li><li><b>A resume studio</b> that scores a resume, rewrites weak lines without inventing anything, and tailors it to a job.</li><li><b>A scam checker</b> for any message a student receives, here or anywhere else.</li><li><b>An FSU-only feed</b> where employer posts must be opportunities or advice for FSU students.</li></ul>
<h3>What this is not</h3><p>A verified badge is not a guarantee. Always confirm an employer through their own website before sharing personal information. This is an independent student project and is not affiliated with Florida State University.</p></div>`;
P.privacy = () => `${pageHead("Privacy")}<div class="prose"><p>Short version: browsing is anonymous, you choose what goes on your profile and who sees it, and you can download or delete everything at any time.</p>
<h3>Students</h3><ul><li>A student account needs a confirmed @fsu.edu address and a password, stored as a salted hash. No student ID, date of birth or SSN.</li><li>Your profile holds only what you type in. Your resume is private unless you share it with approved employers.</li><li>Employers see your profile only if a reviewer approved them and you chose to be visible or are already talking with them. They see your experience, education and projects; other students see only your name, school, headline and skills.</li><li>If you upload a resume, we can fill your profile sections from it. Nothing is added that isn't in your resume, and you can edit or delete every entry.</li><li>Your fit score for a job is worked out when you open it. If you're visible to approved employers, they can see how well you fit their listings: the same score and evidence you see.</li><li>We count which listings students open and whether they press Apply, so employers see totals. They never see who viewed or clicked.</li><li>If you message an employer about a listing, or they invite you or save you from their matches, you appear in that employer's candidate list for it, where they can add a stage and a private note.</li></ul>

  if (inApp) main.innerHTML = `<div class="app">${sidebar(APP_PAGES[name])}<main class="main" id="main"><div class="wrap">${body}</div>${FOOTER}</main></div>`;
  else main.innerHTML = `${hero}<div class="wrap"><main id="main">${body}</main></div>${FOOTER}`;

function go(spec) {
  const hash = spec.indexOf("#"); if (hash >= 0) { S.scrollTo = spec.slice(hash + 1); spec = spec.slice(0, hash); }
  const i = spec.indexOf("?"), name = i < 0 ? spec : spec.slice(0, i), q = {};
  if (i >= 0) new URLSearchParams(spec.slice(i + 1).replace(/&amp;/g, "&")).forEach((v, k) => q[k] = v);
  ["id", "m", "c", "to", "job", "step"].forEach(k => { if (q[k] !== undefined) q[k] = Number(q[k]); });
  S.route = {name, q}; if (name !== "post") S.draft = null;

  if (name !== "item") S.itemDraft = null;

}

document.addEventListener("input", e => {

document.addEventListener("submit", e => {
  e.preventDefault();

  if (id === "postForm") {

    if (d.apply_url && !/^https?:\/\/[^\s<>"']+$/i.test(d.apply_url)) { flash("warning", "The apply URL must start with http:// or https://."); return render(); }

  // profile setup
  const nameOk = v => /^[A-Za-zÀ-ÖØ-öø-ÿ][A-Za-zÀ-ÖØ-öø-ÿ .'\-]{1,59}$/.test(v) && !v.includes("@");
  const url = (v, host) => { if (!v) return ""; if (!/^https?:\/\//i.test(v)) v = "https://" + v; if (!/^https?:\/\/[A-Za-z0-9.-]+\.[A-Za-z]{2,}(?:[\/?#][^\s<>"']*)?$/.test(v)) return null;
    const h = /^https?:\/\/([^\/?#]+)/i.exec(v)[1].toLowerCase(); return host && !(h === host || h.endsWith("." + host)) ? null : v; };

  if (id === "setup1") { const p = SP(me().id), n = g("display_name");
    if (!nameOk(n)) return back(1, "Use letters for your name (no emails or links).");
    if (!g("major")) return back(1, "Major is required.");
    Object.assign(p, {display_name: n, pronouns: g("pronouns").slice(0, 24), major: g("major").slice(0, 80), minor: g("minor").slice(0, 80), degree: g("degree"), grad_term: g("grad_term"), headline: g("headline").slice(0, 120), bio: g("bio").slice(0, 600), setup_step: Math.max(p.setup_step || 0, 1)});
    return go("setup?step=2"); }
  if (id === "setup2") { const p = SP(me().id), skills = many("skills").filter(s => N.POPULAR.includes(s));
    g("more_skills").split(",").forEach(r => { const s = N.normalizeSkill(r); if (s && !skills.includes(s) && !/[<>{}]|https?:/.test(s)) skills.push(s); });
    const roles = g("looking_roles").slice(0, 300).split(",").map(x => x.trim().replace(/\s+/g, " ")).filter(x => x && x.length <= 60).slice(0, 8);
    const locs = g("pref_locations").slice(0, 300).split(/[;|]|,(?!\s*[A-Z]{2}\b)/).map(x => x.trim().replace(/\s+/g, " ")).filter(x => x && x.length <= 60).slice(0, 8);
    Object.assign(p, {skills: skills.slice(0, 30), interests: many("interests"), work_types: many("work_types"), job_kinds: many("job_kinds"), looking_roles: roles, pref_locations: locs, setup_step: Math.max(p.setup_step || 0, 2)});
    return go("setup?step=3"); }
  if (id === "setup3") { const p = SP(me().id), li = url(g("linkedin"), "linkedin.com"), web = url(g("website"));
    if (li === null) return back(3, "LinkedIn should be a linkedin.com address."); if (web === null) return back(3, "Website doesn't look like a web address.");
    Object.assign(p, {links: {linkedin: li, website: web}, visible: !!fd.get("visible"), share_resume: !!fd.get("share_resume"), allow_messages: !!fd.get("allow_messages"), setup_step: 3});
    const finish = (text, name) => {
      let added = 0;
      if (text) { p.resume_text = text.slice(0, 20000); p.resume_name = name; if (!(p.skills || []).length) p.skills = N.extractSkills(text).slice(0, 20); if (!(p.items || []).length) added = importResume(p); }
      S.profileNotice = added ? `We filled in ${added} entr${added === 1 ? "y" : "ies"} from your resume. Check them over and edit anything that's off.` : "";
      flash("verified", "Your profile is set up. Every job now shows how well you fit it."); go("profile"); };

    if (g("about").length < 40) return back(1, "Write at least a couple of sentences about the organization.");

    if (founded && !(/^(?:18|19|20)\d{2}$/.test(founded) && Number(founded) <= new Date().getFullYear())) return back(1, "Founded should be a year, like 2015.");
    if (li === null) return back(1, "LinkedIn should be a linkedin.com address.");
    Object.assign(p, {company: g("company").slice(0, 120), website: web, industry: g("industry"), size: g("size"), location: g("location").slice(0, 120), about: g("about").slice(0, 1500),
      tagline: g("tagline").slice(0, 120), founded, linkedin: li});
    return go("setup?step=2"); }
  if (id === "esetup2") { const p = EP(me().id);
    if (!g("contact_name") || !g("contact_title") || !g("fsu_connection")) return back(2, "Fill in your name, title and how you work with FSU students.");
    Object.assign(p, {contact_name: g("contact_name"), contact_title: g("contact_title"), fsu_connection: g("fsu_connection").slice(0, 800),
      hires_for: many("hires_for").filter(x => N.CATEGORIES.includes(x)), perks: many("perks").filter(x => PERKS.includes(x))});

  if (id === "deleteForm") {
    if (fd.get("password") !== me().pw) { flash("warning", "That password isn't right, so nothing was deleted."); return go("profile"); }

    S.versions = S.versions.filter(v => v.user !== uid); S.session = null;

  }
  // messaging
  if (id === "sendForm") { const c = S.convos.find(x => x.id === S.route.q.c), t = g("body"); if (!t || !c || c.blocked_by) return; sendMessage(c, t.slice(0, 4000)); return render(true); }
  if (id === "newMsgForm") { const to = Number(f.dataset.to), job = Number(f.dataset.job), t = g("body"); if (!t) return;

reset();
render();
