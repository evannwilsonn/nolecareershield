# Render blueprint. The sync:false values are prompted for on first deploy so they
# are never stored in the repo. BASE_URL is your public https address; SMTP_* is your
# mail provider (Postmark, SendGrid, SES, Resend, a university relay...).
services:
  - type: web
    name: nolecareershield
    runtime: docker
    region: oregon           # US; the privacy page says data is stored in the United States
    plan: starter            # persistent disks require a paid instance
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: CLIENT_IP_HEADER          # Render is behind Cloudflare; check /admin/client-ip after deploying
        value: cf-connecting-ip,true-client-ip
      - key: LOGIN_SHARED_IP_MAX
        value: "50"
      - key: RATE_LIMIT_STORE
        value: sqlite
      - key: RATE_LIMIT_PER_MIN
        value: "300"
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_WINDOW_MIN
        value: "15"
      - key: ACCOUNT_MAX_FAILS
        value: "20"
      - key: MAX_BODY_KB
        value: "128"
      - key: MAX_UPLOAD_MB
        value: "9"
      - key: PARSE_TIMEOUT_SECONDS
        value: "10"
      - key: PARSE_MAX_PARALLEL
        value: "2"
      - key: DB_PATH
        value: /data/jobs.db
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: BASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_DAILY_LIMIT
        value: "40"
      - key: AI_SITE_DAILY_LIMIT
        value: "3000"
      - key: AI_MODEL
        value: claude-sonnet-5-5
      # ---- scam intel (optional: each outside check stays off until its key is set) ----
      - key: INTEL_NETWORK
        value: "1"
      - key: INDICATOR_KEY          # empty = derived from SECRET_KEY; changing it later forgets stored contact details
        sync: false
      - key: URLHAUS_AUTH_KEY
        sync: false
      - key: SPAMHAUS_DQS_KEY
        sync: false
      - key: CHAINABUSE_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      # ---- sharing confirmed-scam details with partner schools (SHARE_HMAC_KEY must match theirs) ----
      - key: SHARE_HMAC_KEY
        sync: false
      - key: SHARE_FEED_KEY
        generateValue: true
      - key: SHARE_SOURCE_NAME
        value: NoleCareerShield (FSU)
      - key: PEER_FEEDS
        sync: false
      - key: ARCHIVE_FEEDS
        sync: false
      # ---- forward-by-email checks and the decoy desk (decoys stay off until FSU legal signs off) ----
      - key: INBOUND_EMAIL_TOKEN
        generateValue: true
      - key: DECOY_ENABLED
        sync: false
      # ---- scam model: retraining, staged release, measurement (defaults) ----
      - key: SCAM_MODEL
        value: "on"
      - key: MODEL_AUTO_RELEASE
        value: "1"
      - key: RETRAIN_DAYS
        value: "30"
      - key: RETRAIN_MIN_NEW
        value: "20"
      - key: RETRAIN_EVIDENCE_MIN
        value: "30"
      - key: RETRAIN_CAMPAIGN_MIN
        value: "3"
      - key: RETRAIN_MIN_GAP_DAYS
        value: "3"
      - key: RETRAIN_WAVE_CAP
        value: "3"
      - key: RELEASE_SHADOW_DAYS
        value: "7"
      - key: RELEASE_STAGES
        value: "10,50,100"
      - key: RELEASE_STAGE_DAYS
        value: "3"
      - key: RELEASE_WATCH_DAYS
        value: "14"
      - key: RELEASE_FRESH_MIN
        value: "5"
      - key: RELEASE_TRAFFIC_MIN
        value: "30"
      - key: RELEASE_FP_MAX_RATE
        value: "0.02"
      - key: LOW_RISK_SAMPLE_RATE
        value: "0.03"
      - key: LOW_RISK_SAMPLE_DAILY_MAX
        value: "8"
      # ---- FSU single sign-on (leave empty until FSU ITS registers the app) ----
      - key: SSO_NAME
        value: FSU
      - key: SSO_TENANT_ID
        sync: false
      - key: SSO_CLIENT_ID
        sync: false
      - key: SSO_CLIENT_SECRET
        sync: false
